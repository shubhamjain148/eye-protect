name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count
      - name: Run scheduler tests
        run: swift test
      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/make-dmg.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Eye-Protect-*.dmg dist/Eye-Protect-*.dmg.sha256 \
            --title "Eye-Protect $GITHUB_REF_NAME" \
            --notes "$(cat <<'NOTES'
**Install:** open the DMG and drag Eye-Protect to Applications.

**First launch:** macOS will say *"Eye-Protect" Not Opened* because the app is not notarized. Click **Done**, then go to **System Settings → Privacy & Security**, scroll to Security and click **Open Anyway**. One time only. (macOS 14: right-click the app → Open.)

Verify the download: `shasum -a 256 -c Eye-Protect-*.dmg.sha256`. See the README for details.
NOTES
)"
